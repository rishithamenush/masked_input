name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.27.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter test --platform chrome
      - run: flutter test
        working-directory: example
      - run: flutter build web
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.flutter }}
          path: coverage/lcov.info
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test benchmark
      - run: dart pub global activate pana
      # Initially allow only the missing public-repository metadata points.
      # Set threshold to zero once real repository/issue URLs are configured.
      - run: dart pub global run pana --exit-code-threshold 10 .
