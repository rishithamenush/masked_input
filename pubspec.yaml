name: masked_input
description: Slot-based Flutter input masks with predictable editing, Unicode letters, dynamic masks, and currency formatting without third-party runtime dependencies.
version: 0.1.0
repository: https://github.com/rishithamenush/masked_input
issue_tracker: https://github.com/rishithamenush/masked_input/issues
topics:
  - input
  - mask
  - formatter
  - text-field
  - currency
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
